<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星痕之书 · 序章</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9a84c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --gold: #d4a854;
    --text: #e8e0d0;
    --text-dim: #978c7c;
    --panel-bg: rgba(10, 10, 20, 0.92);
    --panel-border: rgba(180, 140, 60, 0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: #0a0a14;
    font-family: 'PingFang SC', 'Noto Serif SC', 'Source Han Serif SC', serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  .game {
    width:100%; height:100%; max-width:480px; margin:0 auto;
    position:relative; display:flex; flex-direction:column; background:#000;
  }

  /* ===== SCENE ===== */
  .scene {
    flex:1; position:relative; overflow:hidden;
    background: #0a0a14;
  }

  .scene-img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0; transition: opacity 1.5s ease;
  }
  .scene-img.active { opacity:1; }

  /* Star overlay (always visible) */
  .stars { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .star {
    position:absolute;
    background: #fff; border-radius:50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity:0.3;
  }
  @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:.9;transform:scale(1.8)} }

  /* Moon */
  .moon {
    position:absolute; top:6%; right:10%;
    width:50px; height:50px;
    background: radial-gradient(circle at 40% 40%, #ffefc0, #d4a854);
    border-radius:50%;
    box-shadow: 0 0 30px rgba(212,168,84,0.4), 0 0 60px rgba(212,168,84,0.12);
    z-index:3; transition: opacity 2s;
  }

  /* ===== CHARACTER SPRITES ===== */
  .character-area {
    position:absolute; bottom:0; left:0; right:0;
    height:100%; pointer-events:none; z-index:4;
    /* Warm ambient glow behind characters */
    background: radial-gradient(ellipse 80% 30% at 50% 90%, rgba(20,10,5,0.4) 0%, transparent 70%);
  }
  .char-sprite {
    position:absolute; bottom:0;
    max-height:68%;
    opacity:0; transform:translateY(30px);
    transition: opacity 0.8s, transform 0.8s;
    /* Soft oval vignette - fades edges into scene */
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, black 50%, transparent 100%);
    mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, black 50%, transparent 100%);
    /* Gentle shadow for depth */
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
  }
  .char-sprite.active { opacity:1; transform:translateY(0); }
  .char-sprite.left { left:3%; max-width:40%; }
  .char-sprite.center { left:50%; transform:translateX(-50%) translateY(30px); max-width:44%; }
  .char-sprite.center.active { transform:translateX(-50%) translateY(0); }
  .char-sprite.right { right:3%; max-width:40%; }

  /* ===== OVERLAY EFFECTS ===== */
  .overlay {
    position:absolute; inset:0; pointer-events:none; z-index:5;
    transition: background 1s;
  }
  .overlay.flash { background: rgba(255,255,255,0.7); }
  .overlay.dark { background: rgba(0,0,0,0.5); }
  .overlay.none { background: transparent; }

  /* ===== DIALOG PANEL ===== */
  .dialog-panel {
    position:relative;
    background: var(--panel-bg);
    border-top:1px solid var(--panel-border);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    padding:16px 20px 20px;
    padding-bottom:calc(20px + var(--safe-bottom));
    min-height:160px; z-index:10;
  }
  .speaker-tag {
    position:absolute; top:-14px; left:24px;
    background:linear-gradient(135deg,#2a1a40,#1a1030);
    border:1px solid var(--panel-border);
    color:var(--gold); padding:4px 18px;
    font-size:13px; font-weight:bold; border-radius:4px;
    letter-spacing:2px; white-space:nowrap;
  }
  .dialog-text {
    color:var(--text); font-size:16px; line-height:1.8;
    min-height:48px; letter-spacing:.5px; position:relative;
  }
  .dialog-text .cursor {
    display:inline-block; width:2px; height:18px;
    background:var(--gold); margin-left:2px;
    animation:blink .8s step-end infinite;
    vertical-align:text-bottom;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .dialog-text.done .cursor { animation:none; opacity:0; }

  .tap-hint {
    position:absolute; bottom:8px; right:20px;
    color:var(--text-dim); font-size:11px;
    animation:hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:.3} 50%{opacity:.8} }

  .choices {
    display:flex; flex-direction:column; gap:8px; padding:8px 0;
  }
  .choice-btn {
    background:linear-gradient(135deg,rgba(40,25,60,.8),rgba(20,10,30,.8));
    border:1px solid rgba(180,140,60,.3);
    color:var(--text); padding:14px 18px; font-size:15px;
    border-radius:6px; text-align:left; cursor:pointer;
    transition:all .2s; font-family:inherit; letter-spacing:.5px;
  }
  .choice-btn:active {
    background:rgba(180,140,60,.2); border-color:var(--gold);
    transform:scale(.98);
  }
  .choice-btn .choice-icon { color:var(--gold); margin-right:8px; }

  /* ===== TITLE SCREEN ===== */
  .title-screen {
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#1a1a3e 0%,#050510 100%);
    transition:opacity 1s;
  }
  .title-screen.hidden { opacity:0; pointer-events:none; }
  .title-game {
    font-size:36px; color:var(--gold); letter-spacing:8px;
    text-shadow:0 0 30px rgba(212,168,84,.4); margin-bottom:8px;
  }
  .title-sub {
    font-size:14px; color:var(--text-dim); letter-spacing:4px; margin-bottom:48px;
  }
  .title-start {
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    padding:12px 40px; font-size:16px; letter-spacing:4px;
    border-radius:4px; cursor:pointer; font-family:inherit; transition:all .3s;
  }
  .title-start:active { background:rgba(212,168,84,.15); box-shadow:0 0 20px rgba(212,168,84,.2); }

  /* ===== TOP BAR ===== */
  .top-bar {
    position:absolute; top:0; left:0; right:0; z-index:15;
    display:flex; justify-content:space-between;
    padding:12px 16px; padding-top:calc(12px + var(--safe-top));
  }
  .menu-btn {
    background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.6); width:36px; height:36px;
    border-radius:50%; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .2s;
  }
  .menu-btn:active { background:rgba(255,255,255,.1); color:#fff; }
  .menu-btn.music-on { border-color: var(--gold); color: var(--gold); }

  /* ===== MENUS ===== */
  .menu-overlay {
    position:absolute; inset:0; z-index:25;
    background:rgba(5,5,16,.95);
    display:flex; flex-direction:column; align-items:center;
    padding:60px 20px 40px;
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .menu-overlay.show { opacity:1; pointer-events:auto; }
  .menu-title { color:var(--gold); font-size:20px; letter-spacing:4px; margin-bottom:24px; }
  .save-slots { display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; }
  .save-slot {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    padding:12px 16px; border-radius:6px; color:var(--text-dim);
    font-size:14px; cursor:pointer; transition:all .2s;
  }
  .save-slot:active { background:rgba(255,255,255,.1); }
  .save-slot .slot-info { font-size:12px; color:var(--text-dim); }
  .save-slot .slot-actions { display:flex; gap:8px; }
  .slot-btn {
    background:transparent; border:1px solid var(--text-dim);
    color:var(--text-dim); padding:4px 10px; border-radius:3px;
    font-size:12px; cursor:pointer; font-family:inherit;
  }
  .slot-btn:active { border-color:var(--gold); color:var(--gold); }
  .menu-close {
    margin-top:24px; background:transparent; border:1px solid var(--text-dim);
    color:var(--text-dim); padding:10px 30px; border-radius:4px;
    font-size:14px; cursor:pointer; font-family:inherit; letter-spacing:2px;
  }
  .menu-close:active { border-color:var(--gold); color:var(--gold); }

  .log-overlay {
    position:absolute; inset:0; z-index:25;
    background:rgba(5,5,16,.95);
    display:flex; flex-direction:column;
    padding:60px 20px 20px;
    opacity:0; pointer-events:none; transition:opacity .3s; overflow-y:auto;
  }
  .log-overlay.show { opacity:1; pointer-events:auto; }
  .log-entry {
    color:var(--text-dim); font-size:14px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05);
  }
  .log-entry .log-speaker { color:var(--gold); font-weight:bold; margin-right:6px; }

  @media (min-width:481px) { .game { border-left:1px solid #1a1a2e; border-right:1px solid #1a1a2e; } }
  @media (max-height:600px) {
    .dialog-panel { min-height:120px; padding:12px 16px 16px; }
    .dialog-text { font-size:14px; line-height:1.6; }
    .char-sprite { max-height:50%; }
  }
</style>
</head>

<script>
// ============================================================
// PROCEDURAL BGM ENGINE (Web Audio API)
// ============================================================
class BGMEngine {
  constructor() {
    this.ctx = null;
    this.active = true;
    this.currentScene = null;
    this.nodes = [];
    this.gainNode = null;
    this.initOnInteraction();
  }

  initOnInteraction() {
    const handler = () => {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.gainNode = this.ctx.createGain();
        this.gainNode.gain.value = 0.22;
        this.gainNode.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    };
    document.addEventListener('click', handler, {once:false});
    document.addEventListener('touchstart', handler, {once:false});
  }

  stop() {
    this.nodes.forEach(n => { try { n.stop(); } catch(e) {} });
    this.nodes = [];
  }

  playScene(scene) {
    if (!this.ctx || !this.active) return;
    this.stop();
    this.currentScene = scene;

    switch(scene) {
      case 'village': this.playVillage(); break;
      case 'tense': this.playTense(); break;
      case 'forest': this.playForest(); break;
      case 'ruins': this.playRuins(); break;
      case 'port': this.playPortTown(); break;
      case 'airship': this.playAirship(); break;
      case 'floatcity': this.playFloatCity(); break;
      case 'ice': this.playIce(); break;
      case 'library': this.playLibrary(); break;
      case 'skycity': this.playSkycity(); break;
      case 'crystaltower': this.playSkycity(); break;
      case 'battle': this.playBattle(); break;
      case 'abyss': this.playAbyss(); break;
      case 'abyssinside': this.playAbyss(); break;
      case 'finale': this.playFinale(); break;
    }
  }

  // Warm, peaceful village night - pentatonic ambient
  playVillage() {
    const ctx = this.ctx, now = ctx.currentTime;
    // Drone pad - D3 + A3
    const freqs = [146.83, 220.00, 293.66, 440.00];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i < 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.03 * (3-i), now + 1.5);
      gain.gain.linearRampToValueAtTime(0.025 * (3-i), now + 3);
      osc.connect(gain);
      gain.connect(this.gainNode);
      osc.start(now);
      this.nodes.push(osc);

      // Gentle LFO
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 0.08 + i * 0.03;
      lfoGain.gain.value = 0.015;
      lfo.connect(lfoGain);
      lfoGain.connect(gain.gain);
      lfo.start(now);
      this.nodes.push(lfo);
    });

    // Soft bell-like melody - pentatonic D major
    const melody = [293.66, 440.00, 392.00, 293.66, 329.63, 440.00, 392.00, 329.63];
    this.playMelody(melody, 2.5, 0.04, 'sine');
  }

  // Tense / urgent - when the star falls and book appears
  playTense() {
    const ctx = this.ctx, now = ctx.currentTime;
    // Low drone with tension - D diminished feel
    const freqs = [73.42, 146.83, 220.00, 277.18, 349.23];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i === 0 ? 'sawtooth' : (i < 3 ? 'triangle' : 'sine');
      osc.frequency.value = f;
      osc.detune.value = i % 3 === 0 ? 10 : (i % 3 === 1 ? -10 : 0);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.025 * (4-i), now + 0.8);
      gain.gain.linearRampToValueAtTime(0.02 * (4-i), now + 2);
      osc.connect(gain);
      gain.connect(this.gainNode);
      osc.start(now);
      this.nodes.push(osc);

      // Faster, more aggressive LFO
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 1.5 + i * 0.5;

    this.generateStars();
    this.bindClicks();
  }

  generateStars() {
    const container = document.getElementById('stars');
    let html = '';
    for (let i = 0; i < 50; i++) {
      const x = Math.random() * 100, y = Math.random() * 60;
      const size = Math.random() * 1.5 + 0.8;
      const dur = Math.random() * 3 + 2;
      const delay = Math.random() * 5;
      html += `<div class="star" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;--dur:${dur}s;--delay:${delay}s"></div>`;
    }
    container.innerHTML = html;
  }

  bindClicks() {
    document.getElementById('game').addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.menu-overlay') ||
          e.target.closest('.log-overlay') || e.target.closest('.title-screen')) return;
      if (this.isChoice) return;
      if (this.isTyping) { this.finishTyping(); }
      else { this.advance(); }
    });
  }

  toggleMusic() {
    const on = this.bgm.toggle();
    const btn = document.getElementById('music-btn');
    if (on) { btn.classList.add('music-on'); btn.textContent = '🎵'; }
    else { btn.classList.remove('music-on'); btn.textContent = '🔇'; }
  }

  start() {
    document.getElementById('title-screen').classList.add('hidden');
    this.script = SCRIPT;
    this.index = 0;
    this.logData = [];
    const saved = null; // Skip auto-save load for fresh start
    /*
    const saved = this.loadGamePvt('auto');
    if (saved) {
      this.index = saved.index;
      this.logData = saved.log || [];
      this.setScenePvt(saved.scene || 'village');
    }
    */
    this.bgm.playScene('village');
    this.advance();
  }

  advance() {
    if (!this.script || this.index >= this.script.length) { this.showTitle(); return; }
    const line = this.script[this.index];
    this.currentLine = line;
    this.index++;
    if (line.cmd) { this.handleCommand(line); return; }
    if (line.choices) { this.showChoices(line); return; }
    this.showDialog(line);
  }

  handleCommand(line) {
    const cmd = line.cmd;
    switch (cmd) {
      case 'scene': this.setScenePvt(line.bg); break;
      case 'bgm': this.bgm.playScene(line.bg); break;
      case 'sfx': this.bgm.playSFX(line.effect || ''); break;
      case 'effect':
        this.setEffect(line.effect || 'none');
        if (line.effect === 'flash') this.bgm.playSFX('flash');
        break;
      case 'char': this.setCharacter(line.id, line.pos || 'center', line.show !== false); break;
      case 'moon': document.getElementById('moon').style.opacity = line.show ? '1' : '0'; break;
      case 'jump': this.index = line.target; break;
      case 'label': break;
    }
    setTimeout(() => this.advance(), line.wait || 100);
  }

  setScenePvt(name) {
    this.currentScene = name;
    document.querySelectorAll('.scene-img').forEach(el => el.classList.remove('active'));
    const bg = document.getElementById('bg-' + name);
    if (bg) bg.classList.add('active');
    this.bgm.playScene(name);
  }

  setEffect(name) {
    this.overlay.className = 'overlay ' + name;
    if (name !== 'none') setTimeout(() => { this.overlay.className = 'overlay none'; }, 800);
  }

  setCharacter(id, pos, show) {
    const existing = document.getElementById('char-' + id);
    if (existing) existing.remove();
    if (!show) return;

    const imgUrl = this.charImages[id];
    if (!imgUrl) return;

    const el = document.createElement('img');
    el.className = 'char-sprite ' + pos;
    el.id = 'char-' + id;
    el.src = imgUrl;
    el.alt = id;
    el.loading = 'lazy';

    this.charArea.appendChild(el);
    // Trigger transition after append
    requestAnimationFrame(() => {
      requestAnimationFrame(() => el.classList.add('active'));
    });
  }

  showDialog(line) {
    this.isChoice = false;
    this.choicesEl.innerHTML = '';
    this.fullText = line.text || '';
    const speaker = line.speaker || '';
    this.currentSpeaker = speaker;
    const tag = document.getElementById('speaker-tag');
    if (speaker) { tag.textContent = speaker; tag.style.opacity = '1'; }
    else { tag.style.opacity = '0'; }
    if (line.narration) { this.dialogText.style.fontStyle = 'italic'; this.dialogText.style.color = 'var(--text-dim)'; }
    else { this.dialogText.style.fontStyle = 'normal'; this.dialogText.style.color = 'var(--text)'; }
    this.typingIndex = 0;
    this.isTyping = true;
    this.dialogText.classList.remove('done');
    this.dialogText.innerHTML = '';
    this.tapHint.style.display = 'none';
    this.typingTimer = setInterval(() => this.typeChar(), 35);
  }

  typeChar() {
    if (this.typingIndex < this.fullText.length) {
      this.dialogText.innerHTML = this.fullText.substring(0, this.typingIndex + 1).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
      this.typingIndex++;
    } else { this.finishTyping(); }
  }

  finishTyping() {
    clearInterval(this.typingTimer);
    this.isTyping = false;
    this.dialogText.innerHTML = this.fullText.replace(/\n/g, '<br>');
    this.dialogText.classList.add('done');
    this.tapHint.style.display = 'block';
    if (this.currentSpeaker || !this.currentLine?.narration) {
      this.logData.push({ speaker: this.currentSpeaker || '旁白', text: this.fullText });
    }
  }

  showChoices(line) {
    this.isChoice = true;
    this.isTyping = false;
    clearInterval(this.typingTimer);
    this.dialogText.innerHTML = (line.prompt || '') + '<span class="cursor"></span>';
    this.tapHint.style.display = 'none';
    this.choicesEl.innerHTML = '';
    this.bgm.playSFX('choice');
    line.choices.forEach((choice) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-icon">▸</span> ${choice.text}`;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.logData.push({ speaker: '选择', text: choice.text });
        this.isChoice = false;
        this.choicesEl.innerHTML = '';
        this.dialogText.innerHTML = '';
        this.tapHint.style.display = 'block';
        if (choice.jump !== undefined) this.index = choice.jump;
        this.advance();
      });
      this.choicesEl.appendChild(btn);
    });
  }

  saveGamePvt(slot) {
    const data = { index: this.index, scene: this.currentScene, log: this.logData, timestamp: new Date().toLocaleString('zh-CN') };
    try { localStorage.setItem('vn_save_' + slot, JSON.stringify(data)); } catch(e) {}
  }

  loadGamePvt(slot) {
    try { const raw = localStorage.getItem('vn_save_' + slot); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
  }

  saveGame(slot) { this.saveGamePvt(slot); }
  loadGame(slot) { return this.loadGamePvt(slot); }

  autoSave() { this.saveGamePvt('auto'); this.showToast('已快速存档'); }

  showToast(msg) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:var(--gold); padding:8px 20px; border-radius:20px; font-size:13px; z-index:50; pointer-events:none; transition:opacity .5s;';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    setTimeout(() => toast.remove(), 2000);
  }

  toggleMenu() {
    const menu = document.getElementById('save-menu');
    if (menu.classList.contains('show')) { menu.classList.remove('show'); }
    else { this.renderSaveSlots(); menu.classList.add('show'); document.getElementById('log-overlay').classList.remove('show'); }
  }

  toggleLog() {
    const log = document.getElementById('log-overlay');
    if (log.classList.contains('show')) { log.classList.remove('show'); }
    else { this.renderLog(); log.classList.add('show'); document.getElementById('save-menu').classList.remove('show'); }
  }

  renderSaveSlots() {
    const container = document.getElementById('save-slots');
    let html = '';
    for (let i = 1; i <= 4; i++) {
      const data = this.loadGamePvt('slot' + i);
      html += `<div class="save-slot"><div><div>存档 ${i}</div><div class="slot-info">${data ? data.timestamp : '空'}</div></div><div class="slot-actions"><button class="slot-btn" onclick="event.stopPropagation();game.saveGame('slot${i}');game.renderSaveSlots();game.showToast('已存档到位置 ${i}')">存</button>${data ? `<button class="slot-btn" onclick="event.stopPropagation();var d=game.loadGame('slot${i}');game.index=d.index;game.setScenePvt(d.scene);game.logData=d.log;game.toggleMenu();game.advance();game.showToast('已读档')">读</button>` : ''}</div></div>`;
    }
    container.innerHTML = html;
  }

  renderLog() {
    const container = document.getElementById('log-content');
    let html = '';
    this.logData.forEach(entry => { html += `<div class="log-entry"><span class="log-speaker">${entry.speaker}</span>${entry.text}</div>`; });
    container.innerHTML = html || '<div style="color:var(--text-dim);text-align:center;padding:40px">暂无对话记录</div>';
  }

  showTitle() {
    this.saveGamePvt('auto');
    this.dialogText.innerHTML = '<span style="color:var(--gold);text-align:center;display:block;padding:20px">— 第一章 完 —<br><span style="font-size:12px;color:var(--text-dim)">感谢游玩 · 第二章「冰原的图书馆」敬请期待</span></span>';
    this.dialogText.style.fontStyle = 'normal';
    this.dialogText.style.color = 'var(--gold)';
    this.tapHint.style.display = 'none';
    this.choicesEl.innerHTML = '';
    document.getElementById('speaker-tag').style.opacity = '0';
    this.isTyping = false;
    this.index = this.script.length;
  }
}

  { speaker:'阿兹拉姆', text:'好。勇气可嘉。但记住——勇气不等于鲁莽。\n在接下来的旅途中，你的每一个选择都会改变命运的轨迹。' },
  { cmd:'jump', target:83, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'说实话……我很害怕。\n就在今天早上，我还在担心今年的收成。现在突然告诉我，我要去拯救世界……' },
  { speaker:'阿兹拉姆', text:'（微微一笑）\n害怕才是正常的。只有傻子才会在面对未知时毫无畏惧。' },
  { speaker:'阿兹拉姆', text:'真正的勇气，不是不害怕——\n而是即使害怕，依然选择走下去。你觉得呢？' },
  { speaker:'凯恩', text:'……您说得对。\n我害怕——但我更害怕什么都不做，然后后悔一辈子。' },
  { cmd:'label', wait:0 },
  { speaker:'阿兹拉姆', text:'很好。那么——\n让老朽给你第一份"星痕"吧。' },
  { speaker:'', narration:true, text:'老人将法杖轻轻点在凯恩手中的星痕之书上。\n书页无风自动，发出柔和的蓝光。一页崭新的内容在书页间显现——' },
  { cmd:'effect', effect:'flash', wait:400 },
  { speaker:'阿兹拉姆', text:'这是三百年前那场灾难的记载。\n也是你的第一个线索。去吧，去浮空城艾瑟琳——那里有你需要的下一块碎片。' },
  { speaker:'莱拉', text:'浮空城……很远呢。看来得先找个交通工具。' },
  { speaker:'凯恩', text:'（低头看着手中发光的书）\n浮空城、星痕、三百年前的灾难……这简直像做梦一样。' },
  { speaker:'凯恩', text:'但这不是梦。\n这是……我的星痕之书。我的故事。' },
  { speaker:'', narration:true, text:'月光穿过废墟的裂隙，洒在少年手中的书上。\n星光与书页中的光纹交相辉映——仿佛整个世界都在注视着这一刻。' },
  { speaker:'', narration:true, text:'序章 · 星落之夜 —— 完 ——' },
  { speaker:'', narration:true, text:'—— 第一章 · 浮空城的影子 ——' },
  { speaker:'', narration:true, text:'星痕之书的光芒渐渐暗下去之后，阿兹拉姆长老拄着法杖，沉默了一会儿。' },
  { speaker:'阿兹拉姆', text:'天亮再走。你需要回去一趟——不是拿行李。' },
  { speaker:'', narration:true, text:'凯恩明白他的意思。' },
  { speaker:'', narration:true, text:'夜色最深的时候，凯恩悄悄推开家门。\n灶台上还温着一碗麦粥，桌上摊着奶奶的织布——她总是在半夜睡不着的时候起来织几行，说星星陪着她。' },
  { speaker:'', narration:true, text:'奶奶坐在椅子上，没有睡。她面前的油灯快烧尽了，但她没有添油，只是看着跳动的火苗。' },
  { cmd:'char', id:'kaine', pos:'center', wait:400 },
  { speaker:'奶奶', text:'回来了？外面冷，把门带上。' },
  { speaker:'', narration:true, text:'她甚至没有回头。仿佛早就知道他会在这个时间回来。' },
  { speaker:'凯恩', text:'奶奶……我要出一趟远门。' },
  { speaker:'奶奶', text:'多远？' },
  { speaker:'', narration:true, text:'凯恩张了张嘴。他可以说去邻镇，去集市，去任何地方——但他从小到大，从来没对奶奶撒过谎。' },
  { speaker:'凯恩', text:'……可能很远。可能……要很久。' },
  { speaker:'', narration:true, text:'奶奶终于转过头。她的眼睛已经很浑浊了，但她看着凯恩的眼神，像在看一颗明亮的星星。' },
  { speaker:'奶奶', text:'是山坡上掉下来的那道光，对不对？' },
  { speaker:'', narration:true, text:'凯恩愣住了。' },
  { speaker:'奶奶', text:'你以为你每天晚上溜出去，我不知道？你爷爷当年也这样。后来他走了——去了北方，说要去看看这个世界到底有多大。我没拦他。他也从来没后悔。' },
  { speaker:'', narration:true, text:'她从织布机旁边的抽屉里拿出一件东西——一条深蓝色的围巾，上面用银线绣着星纹。' },
  { speaker:'奶奶', text:'你爷爷留下的。他说，万一以后有个小子也像他一样，就把这个给他。' },
  { speaker:'', narration:true, text:'她把围巾放进凯恩手里。布料是旧的，但洗得很干净，叠得很整齐。银线在油灯的光里微微发亮。' },
  { speaker:'凯恩', text:'……奶奶。' },
  { speaker:'奶奶', text:'走吧。天快亮了。你爷爷说过一句话——\n"星辰不会被黑夜困住。它们会自己找到出路。"' },
  { speaker:'', narration:true, text:'她没有哭。也没有再说别的话。只是又开始织布了——梭子在织机上来回作响，每一次都像在说——去吧。' },
  { speaker:'', narration:true, text:'凯恩把围巾围在脖子上，推开门。晨光刚从山脊上透出来。\n他没有回头。但他知道，奶奶也没有。' },
  { cmd:'char', id:'kaine', pos:'center', show:false, wait:300 },
  { speaker:'', narration:true, text:'走到村口时，莱拉的身影在晨光里浮现。' },
  { cmd:'char', id:'lyra', pos:'left', wait:400 },
  { speaker:'莱拉', text:'（看着他脖子上的围巾）……很好的围巾。' },
  { speaker:'凯恩', text:'我爷爷的。' },
  { speaker:'莱拉', text:'我知道。星纹的图案——这是星痕守护者之间用来识别彼此的信物。\n你的爷爷，可能和这件事有比你想象中更深的关联。' },
  { speaker:'', narration:true, text:'凯恩低下头，摸了摸围巾上的银线。' },
  { speaker:'凯恩', text:'我还有很多问题想问她。' },
  { speaker:'莱拉', text:'（轻声）等你回来的时候问。' },
  { speaker:'', narration:true, text:'她顿了顿。' },
  { speaker:'莱拉', text:'契约者从来不问能不能回来。他们只问——值不值得去。' },
  { speaker:'', narration:true, text:'晨风很冷，但围巾上有阳光和旧布料混在一起的味道——那是家的味道。' },
  { speaker:'凯恩', text:'走吧。去十字风港。' },
  { cmd:'scene', bg:'port', wait:1200 },
  { cmd:'char', id:'kaine', pos:'right', wait:300 },
  { cmd:'char', id:'lyra', pos:'left', wait:300 },
  { speaker:'', narration:true, text:'两天后，他们抵达了十字风港——一座建在悬崖边的贸易小镇。' },
  { speaker:'', narration:true, text:'木质栈桥悬在峭壁上，缆车在峡谷间穿梭，港口停泊着几艘小型飞艇。\n空气里混着机油、盐风和烤面包的味道。' },
  { speaker:'凯恩', text:'（眼睛发亮）这么多飞艇！我们是要坐这个去浮空城吗？' },
  { speaker:'莱拉', text:'前提是能找到愿意载我们的船。去浮空城的航线三个月前就停了——\n据说上面的情况不太对。' },
  { speaker:'', narration:true, text:'凯恩在港口问了一圈。每一个船长听到"浮空城"三个字就摇头。\n直到他走进港口最边缘的一间破旧机库——' },
  { cmd:'char', id:'finn', pos:'center', wait:500 },
  { cmd:'char', id:'kaine', pos:'right', wait:0 },
  { speaker:'', narration:true, text:'一个短发的年轻女人正趴在一艘飞艇的引擎盖上，手里攥着扳手，嘴里叼着半根铁钉。' },
  { speaker:'菲恩', text:'（头也不抬）不载客。不送货。不跑腿。不管你想说什么，答案是……"不"。' },
  { speaker:'凯恩', text:'我还没开口呢。' },
  { speaker:'菲恩', text:'（终于抬起头，琥珀色的眼睛打量了他一眼）行吧。说。' },
  { speaker:'凯恩', text:'我们要去浮空城艾瑟琳。' },
  { speaker:'', narration:true, text:'菲恩愣了一下，然后把铁钉从嘴里拿下来，笑了——不是友善的笑，是"你疯了吧"的笑。' },
  { speaker:'菲恩', text:'你知道浮空城现在什么样吗？三个月前最后一艘回来的货船，\n船员说城里一半的建筑都在往下掉。水晶塔忽明忽暗，街道上全是黑色的……东西。' },
  { speaker:'菲恩', text:'他们说不清楚那是什么。只说——别去。' },
  { cmd:'char', id:'lyra', pos:'left', wait:300 },
  { speaker:'莱拉', text:'（显形，语气平静）那些"黑色的东西"，是不是像裂缝一样，在空间里蔓延？' },
  { speaker:'', narration:true, text:'菲恩瞪大了眼睛。不是因为害怕——而是因为莱拉说中了。' },
  { speaker:'菲恩', text:'……你怎么知道？' },
  { speaker:'莱拉', text:'因为我们就是来解决这个问题的。而我需要你帮忙——你的飞艇，还有你知道的一切。' },
  { speaker:'', narration:true, text:'菲恩靠在飞艇上，抱着胳膊想了一会儿。' },
  { speaker:'菲恩', text:'我有个条件。浮空城里有我师父——他是个老机械师，三个月前留在上面检修水晶塔的供能系统。从那以后就断了联系。' },
  { speaker:'菲恩', text:'我帮你们上去。你们帮我找到他。' },
  { choices:[
    { text:'「一言为定。」（爽快答应）', jump:157 },
    { text:'「我不能保证能找到他，但我会尽力。」（谨慎）', jump:161 },
    { text:'「上面的情况我们都不清楚……你自己不上去吗？」（反问）', jump:166 }
  ], prompt:'凯恩看着菲恩——' },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'一言为定。你带我们上去，我们帮你找师父。' },
  { speaker:'菲恩', text:'（嘴角微微一翘）痛快。我开始有点喜欢你了，乡下小子。' },
  { cmd:'jump', target:172, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'我不能保证一定找到他。但我答应你——我会尽力。' },
  { speaker:'', narration:true, text:'菲恩看了他几秒。那种打量的眼神——不像在看一个客户，像在掂量一个人的分量。' },
  { speaker:'菲恩', text:'行。至少你说的是实话。\n比那些满口答应然后跑路的人强。' },
  { cmd:'jump', target:172, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'上面的情况我们都不清楚……你自己不上去吗？' },
  { speaker:'', narration:true, text:'菲恩愣了一下。然后她笑了——这次是真的笑。' },
  { speaker:'菲恩', text:'你以为我想坐在下面干等？当然是一起去。\n逆风号是我的船，我不放心交给别人开。' },
  { speaker:'菲恩', text:'（转头看着飞艇）何况……师父在上面。我至少得亲眼看看。' },
  { cmd:'jump', target:172, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'', narration:true, text:'交易达成了。菲恩把那艘破旧但结实的飞艇——「逆风号」——从机库里拖了出来。' },
  { speaker:'菲恩', text:'逆风号看着破，引擎是我亲手改的。\n只要不遇到龙卷雷暴和噬云兽，应该能把你们活着送到。' },
  { speaker:'凯恩', text:'……"应该"？' },
  { speaker:'菲恩', text:'（咧嘴一笑）冒险嘛，对吧。' },
  { cmd:'scene', bg:'airship', wait:1200 },
  { cmd:'char', id:'kaine', pos:'right', wait:300 },
  { cmd:'char', id:'lyra', pos:'left', wait:300 },
  { cmd:'char', id:'finn', pos:'center', show:false, wait:0 },
  { speaker:'', narration:true, text:'逆风号升空。凯恩第一次坐飞艇，死死抓着船舷栏杆，指节发白。\n菲恩在驾驶座上笑得前仰后合。' },
  { speaker:'', narration:true, text:'云层之上是另一个世界。金色的黄昏光线穿透云隙，远处的浮空岛屿像漂在海上的冰山——只是它们漂在天上。' },
  { speaker:'莱拉', text:'（站在船头，长发被风吹起）三百年没飞过了。这里的云还是老样子。' },
  { speaker:'凯恩', text:'三百年……莱拉，你到底活了多久？' },
  { speaker:'莱拉', text:'（转过头，表情罕见地柔软）久到我已经不记得上一次有人问我这个问题是什么时候了。' },
  { speaker:'', narration:true, text:'凯恩想问更多——关于她，关于上一个契约者，关于三百年前到底发生了什么。\n但莱拉已经转回去看着云海，那个话题显然结束了。' },
  { speaker:'', narration:true, text:'突然，船身猛地一震——' },
  { speaker:'菲恩', text:'（喊道）喂！仪表盘在跳。右边有一大片云不太对。' },
  { speaker:'', narration:true, text:'不是云。是一团漆黑的、扭曲的雾——正在朝他们移动。' },
  { speaker:'莱拉', text:'（声音骤然变冷）裂隙的残留物。它们会吞噬魔力，也会吞噬生命。菲恩——能绕开吗？' },
  { speaker:'菲恩', text:'来不及了——抓紧！' },
  { cmd:'effect', effect:'dark', wait:300 },
  { speaker:'', narration:true, text:'逆风号猛地向右急转，凯恩差点被甩出去。那团黑雾擦着飞艇左翼掠过——\n距离近到他能听见一种低沉的嗡鸣声，像是某种巨大的东西在呼吸。' },
  { cmd:'effect', effect:'flash', wait:400 },
  { speaker:'', narration:true, text:'黑雾擦过的船体上，木材表面瞬间变黑、龟裂。\n菲恩骂了一句，猛推操纵杆——逆风号冲出云层。' },
  { speaker:'', narration:true, text:'然后，浮空城出现在前方。' },
  { cmd:'scene', bg:'floatcity', wait:1500 },
  { cmd:'char', id:'kaine', pos:'right', wait:300 },
  { cmd:'char', id:'lyra', pos:'left', wait:300 },
  { speaker:'', narration:true, text:'浮空城艾瑟琳——曾经是这片大陆最耀眼的城市。\n白色大理石街道悬浮在云海之上，水晶塔日夜不息地向整片大陆输送魔力。' },
  { speaker:'', narration:true, text:'现在，它像一座沉睡的巨兽。' },
  { speaker:'', narration:true, text:'飞艇降落在空无一人的港口。栈桥上覆盖着厚厚的灰尘和干枯的藤蔓。\n远处的水晶塔闪烁着不规律的蓝光，像一个垂死的人勉强睁着眼睛。' },
  { speaker:'菲恩', text:'（低声）比我听说的还糟。师父到底在哪……' },
  { speaker:'莱拉', text:'星痕节点的信号很弱，但方向是确定的——在水晶塔那边。我们先去那里。' },
  { speaker:'凯恩', text:'等等。你们听——' },
  { speaker:'', narration:true, text:'三个人的脚步都停住了。\n街道尽头，有什么东西在移动。不是人——是一团模糊的黑色轮廓，像人形，但边缘不断扭曲、逸散。' },
  { speaker:'', narration:true, text:'它没有眼睛。但凯恩能感觉到——它在"看"他们。' },
  { speaker:'莱拉', text:'裂隙的残影。不要碰它，不要让它碰到你。\n它碰到什么，什么就会被"抹消"——从这个世界的记忆中彻底消失。' },
  { choices:[
    { text:'「绕开它。找别的路去水晶塔。」（安全路线）', jump:210 },
    { text:'「冲过去。莱拉，你的力量能对付它吗？」（消耗莱拉）', jump:217 },
    { text:'「分散它。菲恩，你从左边巷子绕过去找师父。」（分散风险）', jump:226 }
  ], prompt:'三人对视一眼——' },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'绕开它。找别的路去水晶塔。' },
  { speaker:'', narration:true, text:'三人贴着墙壁，从右边的窄巷绕了过去。残影在街道中央徘徊了一会儿，缓缓飘向另一个方向。' },
  { speaker:'', narration:true, text:'路上，他们经过了一间门口挂着齿轮招牌的小工作室——菲恩停了一下。' },
  { speaker:'菲恩', text:'这是我师父的工作室。他以前在这里修水晶供能器……（推开门，里面空无一人，但桌上摊着还在发光的机械图纸）' },
  { speaker:'菲恩', text:'（拿起图纸，快速扫了一眼）他在水晶塔下面画了标记。还在那里。' },
  { cmd:'jump', target:234, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'莱拉，你的力量能对付它吗？' },
  { speaker:'莱拉', text:'（微微点头）站到我身后。' },
  { speaker:'', narration:true, text:'莱拉伸出手，掌心亮起一道星光。残影被光芒照到后剧烈扭曲，发出一声无声的嘶鸣——然后碎了。' },
  { cmd:'effect', effect:'flash', wait:300 },
  { speaker:'', narration:true, text:'但莱拉的身形也随之闪烁了一下，比刚才透明了几分。' },
  { speaker:'凯恩', text:'莱拉——你还好吗？' },
  { speaker:'莱拉', text:'（声音轻了一些）没事。只是需要点时间恢复。走吧，水晶塔不远了。' },
  { cmd:'jump', target:234, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'凯恩', text:'我们引开它。菲恩，你从左边巷子绕过去——先去找你师父的线索。' },
  { speaker:'菲恩', text:'（犹豫了一下）……你们小心。港口那边汇合。' },
  { speaker:'', narration:true, text:'菲恩悄无声息地消失在巷子里。凯恩和莱拉故意踢翻了一个铁桶——残影猛地转向，朝他们飘来。' },
  { speaker:'', narration:true, text:'两人在街道间穿梭引开残影，直到它最终消散在一面断墙后面。' },
  { speaker:'', narration:true, text:'赶到水晶塔时，菲恩已经到了——她手里攥着一张从师父工作室找到的图纸，表情复杂。' },
  { speaker:'菲恩', text:'我师父在水晶塔的核心区。他在用反制力场对抗那些黑雾……已经三个月了。一个人。' },
  { cmd:'jump', target:234, wait:100 },
  { cmd:'label', wait:0 },
  { speaker:'', narration:true, text:'水晶塔脚下的巨大石门半掩着。门内是一个圆形大厅，墙壁上刻满了和星痕遗迹石碑相同的古代文字。' },
  { speaker:'', narration:true, text:'大厅正中央，站着一个人。不是残影——是一个活人。' },
  { cmd:'char', id:'finn', pos:'right', wait:300 },
  { speaker:'', narration:true, text:'中年男人，穿着破旧的工装，手里攥着一把扳手——但这把扳手正抵着一个复杂的机械装置，装置连接着水晶塔的核心。' },
  { speaker:'菲恩', text:'师父！' },

  { speaker:'？？？', text:'欢迎，契约者。我等你很久了。' },
  { cmd:'char', id:'vera', pos:'center', wait:600 },

  { speaker:'？？？', text:'我是薇拉。星痕大图书馆的守护者——也是记忆的编织者。' },
  { speaker:'凯恩', text:'记忆的……编织者？' },

  { speaker:'薇拉', text:'他想用这种力量封印所有的裂隙。但他没有意识到——改写规则的代价，是抹消所有与旧规则相关的记忆。' },
